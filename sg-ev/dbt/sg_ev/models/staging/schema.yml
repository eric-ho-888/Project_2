version: 2

models:

- name: stg_ev_charging
  description: "Cleaned and standardized LTA EV charging point data."

  columns:

  - name: ev_cp_id
    description: "Unique EV charging point identifier."
    data_tests:

    - not_null
    - unique

  - name: station_name
    description: "Name of the EV charging station. May be missing in the LTA source data."

  - name: latitude
    description: "Latitude of the charging station in Singapore."
    data_tests:

    - not_null
    - dbt_expectations.expect_column_values_to_be_between:
        arguments:
          min_value: 1.0
          max_value: 2.0

  - name: longitude
    description: "Longitude of the charging station in Singapore."
    data_tests:

    - not_null
    - dbt_expectations.expect_column_values_to_be_between:
        arguments:
          min_value: 103.0
          max_value: 105.0

  - name: postal_code
    description: "Singapore postal code."
    data_tests:

    - not_null
    - dbt_expectations.expect_column_values_to_match_regex:
        arguments:
          regex: '^[0-9]{6}$'

  - name: plug_type
    description: "EV charging plug type."
    data_tests:

    - not_null

  - name: price
    description: "Charging price; null values are permitted."
    data_tests:

    - dbt_expectations.expect_column_values_to_be_between:
        arguments:
          min_value: 0
          row_condition: "price IS NOT NULL"

  - name: power_rating_kw
    description: "Charging power rating in kW."
    data_tests:

    - not_null
    - dbt_expectations.expect_column_values_to_be_between:
        arguments:
          min_value: 0
          
  - name: current_type
    description: "Electrical current type, such as AC or DC."
    data_tests:

    - accepted_values:
        arguments:
          values: ['AC', 'DC']

  - name: charger_status
    description: "Current charger availability/status."

  - name: ingestion_timestamp
    description: "Timestamp when the record was ingested."
    data_tests:

    - not_null