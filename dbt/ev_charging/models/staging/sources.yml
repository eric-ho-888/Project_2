version: 2

sources:
  - name: ev_raw
    description: "Raw Singapore EV charging point data ingested from LTA DataMall."
    database: sg-ev-charging-analytics
    schema: ev_raw

    tables:
      - name: ev_charging_raw
        description: "Raw EV charging point records from LTA DataMall."

        columns:
          - name: ev_cp_id
            description: "Unique identifier for the EV charging point."
            tests:
              - not_null

          - name: ingestion_timestamp
            description: "Timestamp when the record was ingested."
            tests:
              - not_null